<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>목업 틀</title>
<style>
:root{
  --bg:#0d0f12;--line:#2a2f38;--text:#e9ecf0;--muted:#8d97a3;--dim:#4a525d;
  --park:#62d391;--stop:#f0c350;--drive:#ff9670;--warn:#ff6464;--out:#b7a2ff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}

.top{display:flex;align-items:center;gap:6px;padding:12px 16px 0}
.tab{padding:5px 12px;border-radius:999px;color:var(--muted)}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--text);color:var(--bg);font-weight:600}
.tools{margin-left:auto;display:flex;gap:2px}
.icon{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon:hover{color:var(--text);background:#1a1e25}
.icon[aria-pressed="true"]{color:var(--text)}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.area{min-height:0;min-width:0;display:grid;place-items:center;padding:16px}
.bezel{background:#000;border-radius:18px;padding:10px;box-shadow:0 0 0 1px #2b303a,0 30px 80px rgba(0,0,0,.6)}
.sizer{position:relative;overflow:hidden;border-radius:9px;background:#11141a}
.screen{position:absolute;left:0;top:0;transform-origin:0 0;background:#11141a;overflow:hidden}
.screen iframe,.screen img{display:block;width:100%;height:100%;border:0}
.screen img{object-fit:contain;background:#000}
.empty{width:100%;height:100%;display:grid;place-content:center;justify-items:center;gap:24px;text-align:center;
  background:repeating-linear-gradient(135deg,#141820 0 40px,#171c25 40px 80px)}
.empty .tag{font:600 34px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.04em}
.empty .ttl{font-size:76px;font-weight:700;line-height:1.2;max-width:1500px;color:#cfd6df}

.bar{display:flex;align-items:center;gap:14px;padding:0 16px 14px;flex-wrap:wrap;min-height:44px}
.strip{display:flex;gap:4px;flex-wrap:wrap}
.dot{min-width:30px;height:30px;padding:0 6px;border-radius:8px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);border:1px dashed var(--dim)}
.dot.has{color:var(--muted);border:1px solid var(--line)}
.dot:hover{color:var(--text)}
.dot[aria-current="true"]{background:var(--text);color:var(--bg);border:1px solid var(--text);font-weight:700}
.now{font-size:17px;font-weight:600}
.state{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--bg);background:var(--muted)}
.state.park{background:var(--park)}.state.stop{background:var(--stop)}.state.drive{background:var(--drive)}
.state.warn{background:var(--warn)}.state.out{background:var(--out)}
.state:empty{display:none}

body.rec{grid-template-rows:1fr auto}
body.rec .top{display:none}
body.rec .strip{display:none}
body.rec .bar{justify-content:center}
body.nocap .bar{display:none}
.nodata{grid-row:1/-1;display:grid;place-content:center;text-align:center;color:var(--muted);padding:40px}
.nodata code{color:var(--text)}
</style>
</head>
<body>
<div class="top" id="top">
  <div id="tabs" role="tablist" aria-label="앱"></div>
  <div class="tools">
    <button class="icon" id="prev" title="이전 (←)" aria-label="이전 장면"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="icon" id="next" title="다음 (→)" aria-label="다음 장면"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="icon" id="cap" title="장면 이름 (C)" aria-label="장면 이름 표시" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h10"/></svg></button>
    <button class="icon" id="rec" title="녹화 모드 (R)" aria-label="녹화 모드" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg></button>
    <button class="icon" id="full" title="전체 화면 (F)" aria-label="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>
<div class="area" id="area">
  <div class="bezel"><div class="sizer" id="sizer"><div class="screen" id="screen"></div></div></div>
</div>
<div class="bar" id="bar">
  <div class="strip" id="strip"></div>
  <span class="now" id="now"></span>
  <span class="state" id="state"></span>
</div>

<!-- 장면 데이터: projects/<p>/SCENARIO.md 2절에서 build.mjs가 만듭니다 -->
<script src="data/grandma.js"></script>
<script src="data/game.js"></script>
<script>
(function () {
  var DATA = window.MOCKUP_DATA || {};
  var keys = Object.keys(DATA);
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  if (!keys.length) {
    var box = el('div', 'nodata');
    box.append(el('code', '', 'node spikes/mockup-frame/build.mjs'));
    document.body.replaceChildren(box);
    return;
  }

  var state = { p: keys[0], i: 0 };
  var shown = null;

  function stateClass(s) {
    if (/경고/.test(s)) return ' warn';
    if (/주행/.test(s)) return ' drive';
    if (/주차/.test(s)) return ' park';
    if (/정차/.test(s)) return ' stop';
    if (/밖/.test(s)) return ' out';
    return '';
  }

  function readHash() {
    var parts = decodeURIComponent(location.hash.replace(/^#/, '')).split('/');
    if (DATA[parts[0]]) {
      state.p = parts[0];
      var idx = DATA[state.p].scenes.findIndex(function (s) { return s.id === parts[1]; });
      state.i = idx >= 0 ? idx : 0;
    }
    document.body.classList.toggle('rec', parts.indexOf('rec') >= 0);
    document.body.classList.toggle('nocap', parts.indexOf('nocap') >= 0);
  }

  function writeHash() {
    var s = DATA[state.p].scenes[state.i];
    var parts = [state.p, s ? s.id : ''];
    if (document.body.classList.contains('rec')) parts.push('rec');
    if (document.body.classList.contains('nocap')) parts.push('nocap');
    var next = '#' + parts.join('/');
    if (location.hash !== next) history.replaceState(null, '', next);
  }

  function fit() {
    var d = DATA[state.p], area = $('area');
    var w = area.clientWidth - 32 - 20, h = area.clientHeight - 32 - 20;
    var scale = Math.max(0.05, Math.min(w / d.width, h / d.height));
    var screen = $('screen'), sizer = $('sizer');
    screen.style.width = d.width + 'px';
    screen.style.height = d.height + 'px';
    screen.style.transform = 'scale(' + scale + ')';
    sizer.style.width = Math.round(d.width * scale) + 'px';
    sizer.style.height = Math.round(d.height * scale) + 'px';
  }

  function drawScreen(d, s) {
    var key = state.p + '/' + (s ? s.id : '');
    if (shown === key) return;
    shown = key;
    var screen = $('screen');
    if (!s) { screen.replaceChildren(); return; }
    if (s.src && s.kind === 'image') {
      var img = el('img'); img.src = s.src; img.alt = s.id + ' ' + s.title;
      screen.replaceChildren(img);
    } else if (s.src) {
      var frame = el('iframe'); frame.src = s.src; frame.title = s.id + ' ' + s.title;
      screen.replaceChildren(frame);
    } else {
      var empty = el('div', 'empty');
      empty.append(el('div', 'tag', s.id), el('div', 'ttl', s.title));
      screen.replaceChildren(empty);
    }
  }

  function render() {
    var d = DATA[state.p], s = d.scenes[state.i];
    $('tabs').replaceChildren.apply($('tabs'), keys.map(function (k) {
      var b = el('button', 'tab', DATA[k].name);
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(k === state.p));
      b.onclick = function () { state.p = k; state.i = 0; render(); };
      return b;
    }));
    $('strip').replaceChildren.apply($('strip'), d.scenes.map(function (sc, i) {
      var b = el('button', 'dot' + (sc.src ? ' has' : ''), String(i + 1));
      b.title = sc.id + ' ' + sc.title;
      b.setAttribute('aria-label', sc.id + ' ' + sc.title);
      b.setAttribute('aria-current', String(i === state.i));
      b.onclick = function () { state.i = i; render(); };
      return b;
    }));
    $('now').textContent = s ? s.title : '';
    $('state').textContent = s ? s.state : '';
    $('state').className = 'state' + (s ? stateClass(s.state) : '');
    $('cap').setAttribute('aria-pressed', String(!document.body.classList.contains('nocap')));
    $('rec').setAttribute('aria-pressed', String(document.body.classList.contains('rec')));
    drawScreen(d, s);
    fit();
    writeHash();
    document.title = (s ? d.code + '-' + s.id + ' ' + s.title + ' · ' : '') + d.name;
  }

  function step(n) {
    var len = DATA[state.p].scenes.length;
    if (!len) return;
    state.i = Math.min(len - 1, Math.max(0, state.i + n));
    render();
  }
  function toggle(cls) { document.body.classList.toggle(cls); render(); }
  function full() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  }

  $('prev').onclick = function () { step(-1); };
  $('next').onclick = function () { step(1); };
  $('cap').onclick = function () { toggle('nocap'); };
  $('rec').onclick = function () { toggle('rec'); };
  $('full').onclick = full;
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') step(1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') step(-1);
    else if (e.key === 'r' || e.key === 'R' || e.key === 'ㄱ') toggle('rec');
    else if (e.key === 'c' || e.key === 'C' || e.key === 'ㅊ') toggle('nocap');
    else if (e.key === 'f' || e.key === 'F' || e.key === 'ㄹ') full();
    else return;
    e.preventDefault();
  });
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function () { readHash(); render(); });

  readHash();
  render();
})();
</script>
</body>
</html>
